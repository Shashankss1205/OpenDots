name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Portable regression tests
        env:
          OPENDOTS_TEST_SANDBOX: trusted-local
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/opendots" init --directory "$RUNNER_TEMP/opendots-smoke"
          "$RUNNER_TEMP/installed/bin/opendots" --config "$RUNNER_TEMP/opendots-smoke/config.json" status
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-python-${{ matrix.python }}
          path: dist/*
  isolation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Real namespace regression tests
        run: python -m unittest discover -s tests -v
