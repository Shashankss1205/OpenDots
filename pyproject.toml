[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendots-local-prototype"
version = "0.1.5"
description = "Event-driven agents with persistent targets and reviewable local actions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opendots = "opendots.__main__:main"
spots = "opendots.__main__:main"

[tool.setuptools.packages.find]
include = ["opendots*", "spots*"]

[tool.setuptools.package-data]
opendots = ["web/*"]
